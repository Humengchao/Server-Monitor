services:
  backend:
    image: ${BACKEND_IMAGE}
    ports:
      - "19527:19527"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:19527/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-monitor}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-server_monitor}?sslmode=${POSTGRES_SSLMODE:-disable}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SERVER_PORT: "19527"
      CORS_ORIGIN: http://${DOMAIN:-localhost:19080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    image: ${FRONTEND_IMAGE}
    ports:
      - "19080:80"
    environment:
      DOMAIN: ${DOMAIN}
      VIRTUAL_HOST: ${DOMAIN}
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: ${DOMAIN}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default
      - proxy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

networks:
  proxy:
    external: true
