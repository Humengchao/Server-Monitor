name: Build and Deploy
on:
  push:
    branches: [main]
    paths: ['web/**', 'shared/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
concurrency:
  group: server-monitor-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: monitor_test
          POSTGRES_PASSWORD: monitor_test
          POSTGRES_DB: monitor_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U monitor_test" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SERVER_MONITOR_TEST_DATABASE_URL: postgres://monitor_test:monitor_test@localhost:5432/monitor_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: web/backend/go.mod
          cache-dependency-path: web/backend/go.sum
      - name: Test backend
        shell: bash
        run: |
          go test -race ./... 2>&1 | tee "$RUNNER_TEMP/go-tests.log"
          go vet ./...
        working-directory: web/backend
      - name: Report backend failures
        if: failure()
        run: node shared/scripts/ci-errors.mjs "$RUNNER_TEMP/go-tests.log"
      - name: Check Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: web/backend
      - run: bash web/scripts/deploy_test.sh
      - name: Test Agent installation lifecycle in an isolated container
        run: docker run --rm -e AGENT_INSTALL_TEST_CONTAINER=1 -v "$PWD/web/backend/agent-assets:/assets:ro" ubuntu:24.04 bash /assets/install_test.sh
      - run: node shared/scripts/generate-probes.mjs --check
      - run: npm ci && npm audit --audit-level=moderate && npm run lint && npm run build && npx playwright install --with-deps chromium && npm run test:smoke
        working-directory: web/frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: web/frontend/test-results
  verify-windows-agent:
    name: Windows Agent protocol and service
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: web/backend/go.mod
          cache-dependency-path: web/backend/go.sum
      - name: Test Windows Agent protocol
        shell: pwsh
        working-directory: web/backend
        run: |
          $testLog = Join-Path $env:RUNNER_TEMP 'windows-agent-protocol-tests.log'
          go test ./internal/agenttransport -count=1 -timeout=120s 2>&1 | Tee-Object -FilePath $testLog
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            $failureText = (Get-Content -LiteralPath $testLog -Tail 80) -join "`n"
            $annotation = $failureText.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::$annotation"
            exit $testExit
          }
          go vet ./cmd/agent ./internal/agenttransport
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./internal/services -run 'TestCPUCounter|TestWindowsCollectionDoesNot|TestCounterResets|TestWindowsProbeUses' -count=1 -timeout=120s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'agent-assets/install.ps1'), [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { $parseErrors | Write-Error; exit 1 }
      - name: Test Windows service and isolated installation lifecycle
        shell: pwsh
        working-directory: web/backend
        run: |
          # Includes the native installer fixture: temporary paths and mock
          # downloads/services only; no administrator privileges are needed.
          $testLog = Join-Path $env:RUNNER_TEMP 'windows-agent-service-install-tests.log'
          go test ./cmd/agent -count=1 -timeout=120s 2>&1 | Tee-Object -FilePath $testLog
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            $failureText = (Get-Content -LiteralPath $testLog -Tail 80) -join "`n"
            $annotation = $failureText.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::$annotation"
            exit $testExit
          }
  build-and-push:
    needs: [verify, verify-windows-agent]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./web/backend
          build-args: BUILD_VERSION=${{ github.sha }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: ./web/frontend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      DEPLOY_SHA: ${{ github.sha }}
      DEPLOY_REPOSITORY: ${{ github.repository }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
      GHCR_USER: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v4
      - name: Require a trusted deployment identity
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST_FINGERPRINT: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
        run: |
          test -n "$DEPLOY_KEY" || { echo 'Configure DEPLOY_KEY before deployment'; exit 1; }
          [[ "$DEPLOY_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]+$ ]] || { echo 'Configure a verified DEPLOY_HOST_FINGERPRINT before deployment'; exit 1; }
      - name: Release exact commit
        id: release
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          command_timeout: 20m
          envs: DEPLOY_SHA,DEPLOY_REPOSITORY,GHCR_PAT,GHCR_USER
          script: |
            set -e
            if [ -n "$GHCR_PAT" ]; then printf '%s' "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin; fi
            if [ ! -d /opt/server-monitor/.git ]; then
              git init /opt/server-monitor
              git -C /opt/server-monitor remote add origin "https://github.com/$DEPLOY_REPOSITORY.git"
            fi
            git -C /opt/server-monitor fetch origin "$DEPLOY_SHA"
            prefix="ghcr.io/$(printf '%s' "$DEPLOY_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
            git -C /opt/server-monitor show "$DEPLOY_SHA:web/scripts/deploy.sh" > /opt/server-monitor/deploy-runner.sh
            bash /opt/server-monitor/deploy-runner.sh deploy "$DEPLOY_SHA" "$prefix"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Production browser smoke
        env:
          SMOKE_BASE_URL: https://${{ secrets.DOMAIN }}
        run: npm ci && npx playwright install --with-deps chromium && npm run test:production
        working-directory: web/frontend
      - name: Roll back failed production smoke
        if: failure() && steps.release.outcome == 'success'
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          command_timeout: 10m
          envs: DEPLOY_SHA
          script: bash /opt/server-monitor/deploy-runner.sh rollback "$DEPLOY_SHA"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: production-browser-results
          path: web/frontend/test-results-production
