name: Build and Deploy
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
concurrency:
  group: server-monitor-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: web/backend/go.mod
          cache-dependency-path: web/backend/go.sum
      - run: go test -race ./... && go vet ./...
        working-directory: web/backend
      - run: bash web/scripts/deploy_test.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm ci && npm run lint && npm run build && npx playwright install --with-deps chromium && npm run test:smoke
        working-directory: web/frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: web/frontend/test-results
  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./web/backend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: ./web/frontend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      DEPLOY_SHA: ${{ github.sha }}
      DEPLOY_REPOSITORY: ${{ github.repository }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
      GHCR_USER: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v4
      - name: Release exact commit
        id: release
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          command_timeout: 20m
          envs: DEPLOY_SHA,DEPLOY_REPOSITORY,GHCR_PAT,GHCR_USER
          script: |
            set -e
            if [ -n "$GHCR_PAT" ]; then printf '%s' "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin; fi
            if [ ! -d /opt/server-monitor/.git ]; then
              git init /opt/server-monitor
              git -C /opt/server-monitor remote add origin "https://github.com/$DEPLOY_REPOSITORY.git"
            fi
            git -C /opt/server-monitor fetch origin "$DEPLOY_SHA"
            prefix="ghcr.io/$(printf '%s' "$DEPLOY_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
            git -C /opt/server-monitor show "$DEPLOY_SHA:web/scripts/deploy.sh" > /opt/server-monitor/deploy-runner.sh
            bash /opt/server-monitor/deploy-runner.sh deploy "$DEPLOY_SHA" "$prefix"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Production browser smoke
        env:
          SMOKE_BASE_URL: https://${{ secrets.DOMAIN }}
        run: npm ci && npx playwright install --with-deps chromium && npm run test:smoke
        working-directory: web/frontend
      - name: Roll back failed production smoke
        if: failure() && steps.release.outcome == 'success'
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          command_timeout: 10m
          envs: DEPLOY_SHA
          script: bash /opt/server-monitor/deploy-runner.sh rollback "$DEPLOY_SHA"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: production-browser-results
          path: web/frontend/test-results
