# Pinned so the project keeps the name it had when this file lived at the
# repository root: compose otherwise derives it from the directory ("web"),
# which would start a second copy next to the running one and fail on ports.
name: server-monitor

services:
  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    ports:
      - "19527:19527"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:19527/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    environment:
      # sslmode defaults to disable, which is only safe while the database sits
      # on this host or the same bridge network; set POSTGRES_SSLMODE=require
      # when the database is remote.
      DATABASE_URL: postgres://${POSTGRES_USER:-monitor}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-server_monitor}?sslmode=${POSTGRES_SSLMODE:-disable}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SERVER_PORT: "19527"
      CORS_ORIGIN: http://${DOMAIN:-localhost:19080}
      POLL_INTERVAL: ${POLL_INTERVAL:-3}
      ALERT_INTERVAL: ${ALERT_INTERVAL:-30}
      # Alert webhooks may not target the host's private network unless this is
      # explicitly enabled. See README security notes.
      ALLOW_PRIVATE_WEBHOOKS: ${ALLOW_PRIVATE_WEBHOOKS:-false}
      # Open signup is on by default; set to false once your accounts exist and
      # the register endpoint starts answering 403. See README security notes.
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    ports:
      - "19080:80"
    environment:
      DOMAIN: ${DOMAIN}
      VIRTUAL_HOST: ${DOMAIN}
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: ${DOMAIN}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default
      - proxy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

networks:
  proxy:
    external: true
